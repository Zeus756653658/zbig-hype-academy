<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Checkout | ZBigHype Academy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container section">
    <div class="checkout-hero">
      <div class="brand"><span>ZBig</span>Hype Academy</div>
      <h1>Secure Checkout</h1>
    </div>
    <section class="two-col">
      <div class="panel">
        <h2>UPI Payment</h2>
        <p>Scan the QR code using your UPI app.</p>
        <img src="/assets/payment-qr.png" alt="UPI Payment QR" onerror="this.outerHTML='<div class=&quot;video-placeholder&quot;>QR image unavailable. Please add /public/assets/payment-qr.png.</div>'">
        <p>Google Pay · PhonePe · Paytm · BHIM</p>
        <button class="btn btn-primary" id="openModal">I Have Completed Payment</button>
      </div>
      <div class="panel">
        <h2 id="paymentCourse"></h2>
        <p id="paymentCategory"></p>
        <div class="course-foot"><span>Amount</span><strong id="paymentAmount"></strong></div>
        <div class="course-foot"><span>Total</span><strong id="paymentTotal"></strong></div>
      </div>
    </section>
    <div class="modal" id="modal">
      <form class="panel modal-card form" id="payForm">
        <h2>Payment Confirmation</h2>
        <input name="user_name" placeholder="Full Name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="phone" placeholder="WhatsApp / Mobile Number" required>
        <input name="transaction_id" placeholder="UTR / Transaction ID" required>
        <input name="course_slug" type="hidden">
        <button class="btn btn-primary" type="submit">Submit Confirmation</button>
        <button type="button" class="btn btn-secondary" id="closeModal">Cancel</button>
        <p id="payError"></p>
      </form>
    </div>
  </main>
  <script src="/js/main.js"></script>
  <script src="/js/payment.js"></script>
  <script>
    initPayment();
    openModal.onclick = () => modal.classList.add('open');
    closeModal.onclick = () => modal.classList.remove('open');
    payForm.onsubmit = async e => {
      e.preventDefault();
      payError.textContent = '';
      try {
        await submitPayment(payForm);
      } catch (err) {
        payError.textContent = err.message;
      }
    };
  </script>
</body>
</html>
