<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signup | ZBigHype Academy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="centered"><form class="panel modal-card form" id="signupForm"><h1>Create account</h1><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><input name="confirm_password" type="password" placeholder="Confirm Password" required><button class="btn btn-primary" type="submit">Create Account</button><p id="signupError"></p><a href="/login.html">Already have an account?</a></form></main><script src="/js/main.js"></script><script src="/js/auth.js"></script><script>signupForm.onsubmit=async e=>{e.preventDefault();signupError.textContent='';try{await handleSignup(signupForm)}catch(err){signupError.textContent=err.message}}</script></body></html>
