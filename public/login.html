<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | ZBigHype Academy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="centered"><form class="panel modal-card form" id="loginForm"><h1>Welcome back</h1><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn btn-primary" type="submit">Login</button><p id="loginError"></p><a href="/signup.html">Create an account</a></form></main><script src="/js/main.js"></script><script src="/js/auth.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{await handleLogin(loginForm)}catch(err){loginError.textContent=err.message}}</script></body></html>
